<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Брендированный Переводчик</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: transparent; 
        }
        .translator-container { 
            max-width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .controls { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            justify-content: center; 
        }
        .translator-box { 
            display: flex; 
            gap: 15px; 
            width: 100%; 
        }
        .field-group {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        textarea { 
            width: 100%; 
            height: 180px; 
            padding: 15px; 
            border: 1px solid #dadce0; 
            border-radius: 10px; 
            font-size: 16px; 
            outline: none; 
            resize: none;
            box-sizing: border-box; 
            font-family: inherit;
        }
        textarea:focus { 
            border-color: #1a73e8; 
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        .output-text-box { 
            background-color: #f8f9fa; 
            color: #3c4043; 
            border: 1px solid #dadce0; 
            border-radius: 10px; 
            padding: 15px;
            font-size: 16px;
            height: 180px;
            box-sizing: border-box;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        button { 
            padding: 10px 24px; 
            background: #1a73e8; color: white; border: none; border-radius: 8px; 
            font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; 
        }
        button:hover { background: #1557b0; }
        
        /* Секретный трюк: заставляем правый блок принудительно считаться английским для систем перевода */
        .en-target-zone {
            content-visibility: auto;
        }
    </style>
</head>
<body>

<div class="translator-container">
    <div class="controls">
        <span>Русский</span>
        <button id="translateBtn">Перевести ⇄</button>
        <span>Английский (перевод кликом мыши)</span>
    </div>

    <div class="translator-box">
        <div class="field-group">
            <textarea id="inputText" placeholder="Введите любой текст (сложные фразы, абзацы)..."></textarea>
        </div>
        <div class="field-group">
            <!-- Блок перевода, обернутый в специальный тег, который браузер предлагает перевести -->
            <div id="outputText" class="output-text-box en-target-zone" lang="en">Здесь появится готовый перевод</div>
        </div>
    </div>
</div>

<script>
    document.getElementById('translateBtn').addEventListener('click', function() {
        const text = document.getElementById('inputText').value.trim();
        const outputField = document.getElementById('outputText');

        if (!text) {
            outputField.textContent = "Пожалуйста, введите текст.";
            outputField.style.color = "#3c4043";
            return;
        }

        // Переносим текст в правое окно
        outputField.textContent = text;
        outputField.style.color = "#000";

        // Инструкция для пользователя, так как перевод делает сам браузер
        alert("Текст скопирован в окно перевода! Теперь просто нажмите правой кнопкой мыши по правому серому окошку и выберите «Перевести на английский» (или используйте всплывающую панель переводчика вашего браузера вверху экрана).");
    });
</script>

</body>
</html>
