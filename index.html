<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Custom Translator Widget</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: transparent; 
            text-align: center;
        }
        .translator-container { 
            max-width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            gap: 15px;
        }
        /* Центрируем панель управления */
        #google_translate_element {
            margin: 10px 0;
            padding: 5px;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            display: inline-block;
        }
        /* Стилизуем профессиональное поле для ввода текста */
        textarea { 
            width: 100%; 
            height: 180px; 
            padding: 15px; 
            border: 1px solid #dadce0; 
            border-radius: 12px; 
            font-size: 16px; 
            outline: none; 
            box-sizing: border-box;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            resize: none;
            font-family: inherit;
        }
        textarea:focus { 
            border-color: #1a73e8; 
        }
        .info-text {
            font-size: 12px;
            color: #70757a;
            margin-top: 5px;
        }
        /* Аккуратно скрываем лишние элементы гугловского тулбара */
        .goog-te-banner-frame.skiptranslate, .goog-te-gadget-icon {
            display: none !important;
        }
        body {
            top: 0px !important;
        }
    </style>
</head>
<body>

<div class="translator-container">
    <!-- Сюда автоматически встроится аккуратный выбор языков от Google -->
    <div id="google_translate_element"></div>

    <!-- Поле, в которое пользователь вводит фразу. Она переведется прямо внутри него на лету -->
    <textarea id="inputText" placeholder="Введите любой сложный текст (фразы, абзацы). Выберите нужный язык в меню выше, и этот текст мгновенно и полностью переведется..."></textarea>
    
    <div class="info-text">Система машинного перевода интегрирована в интерфейс вашего бренда</div>
</div>

<!-- Вызываем рабочий корпоративный модуль Google, адаптированный под фреймы -->
<script type="text/javascript">
function googleTranslateElementInit() {
    new google.translate.TranslateElement({
        pageLanguage: 'auto', 
        // Вы можете добавить сюда любые нужные языки через запятую
        includedLanguages: 'ru,en,de,es,fr,zh-CN', 
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        multilanguagePage: true
    }, 'google_translate_element');
}
</script>

<script type="text/javascript" src="https://google.com"></script>

</body>
</html>
