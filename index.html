<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Custom Translator</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: transparent; 
        }
        .translator-container { 
            max-width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .controls { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            justify-content: center; 
        }
        .translator-box { 
            display: flex; 
            gap: 15px; 
            width: 100%; 
        }
        textarea { 
            width: 50%; 
            height: 180px; 
            padding: 15px; 
            border: 1px solid #dadce0; 
            border-radius: 10px; 
            font-size: 16px; 
            outline: none; 
            resize: none;
            box-sizing: border-box; 
            font-family: inherit;
        }
        textarea:focus { 
            border-color: #1a73e8; 
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        textarea[readonly] { 
            background-color: #f8f9fa; 
            color: #3c4043; 
        }
        select { 
            padding: 10px 16px; 
            border: 1px solid #dadce0; 
            border-radius: 8px; 
            font-size: 14px; 
            background: white; 
            cursor: pointer; 
            outline: none; 
        }
        button { 
            padding: 10px 24px; 
            background: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { 
            background: #1557b0; 
        }
        @media (max-width: 600px) { 
            .translator-box { flex-direction: column; } 
            textarea { width: 100%; height: 130px; } 
        }
    </style>
</head>
<body>

<div class="translator-container">
    <div class="controls">
        <select id="langFrom">
            <option value="ru" selected>Русский</option>
            <option value="en">Английский</option>
        </select>
        
        <button id="translateBtn">Перевести</button>
        
        <select id="langTo">
            <option value="en" selected>Английский</option>
            <option value="ru">Русский</option>
        </select>
    </div>

    <div class="translator-box">
        <textarea id="inputText" placeholder="Введите сложный текст (например: Здравствуйте! Как у вас жизнь?)..."></textarea>
        <textarea id="outputText" placeholder="Здесь появится готовый перевод" readonly></textarea>
    </div>
</div>

<script>
    // Встроенный ИИ-словарь правил перевода (работает локально, без сети)
    const localBrain = {
        "ru-en": {
            "здравствуйте": "hello", "как у вас жизнь": "how is your life", "привет": "hi", "как дела": "how are you",
            "хорошо": "fine", "отлично": "great", "мир": "world", "спасибо": "thank you", "до свидания": "goodbye",
            "я": "i", "люблю": "love", "создавать": "create", "сайты": "websites", "это": "it is", "мой": "my", "ты": "you", "please": "пожалуйста", "yes": "да", "no": "нет", "friend": "друг",
            "family": "семья", "happy": "счастливый", "cool": "круто", "awesome": "потрясающе", "maybe": "может быть",
            "help": "помощь", "beautiful": "красивый", "sorry": "извини", "good morning": "доброе утро", "night": "ночь", "water": "вода",
            "food": "еда", "money": "деньги", "time": "время", "work": "работа", "cat": "кот", "dog": "собака"
        },
        "en-ru": {
            "hello": "здравствуйте", "how is your life": "как у вас жизнь", "hi": "привет", "how are you": "как дела",
            "fine": "хорошо", "great": "отлично", "world": "мир", "thank you": "спасибо", "goodbye": "до свидания", "you": "ты", "wow": "вау",
            "i": "я", "love": "люблю", "create": "создавать", "websites": "сайты", "it is": "это", "my": "мой", "пожалуйста": "please", "да": "yes", "нет": "no", "друг": "friend", "семья": "family", "любовь": "love", "счастливый": "happy", "круто": "cool", "потрясающе": "awesome",
        "может быть": "maybe", "помощь": "help", "красивый": "beautiful", "извини": "sorry", "доброе утро": "good morning", "ночь": "night", "вода": "water", "еда": "food", "деньги": "money",
        "время": "time", "работа": "work", "кот": "cat", "собака": "dog", "ты": "you", "вау": "wow", "удача": "luck", "успех": "success", "жизнь": "life", "мир": "world", "солнце": "sun",
        "книга": "book", "город": "city", "дом": "house", "дорога": "road", "окно": "window", "дверь": "door", "школа": "school", "учитель": "teacher", "ребенок": "child", "день": "day", "праздник": "holiday",
        "подарок": "gift", "улыбка": "smile", "песня": "song", "игра": "game", "быстро": "fast", "хорошо": "well", "пока": "bye"
        }
    };

    document.getElementById('translateBtn').addEventListener('click', function() {
        const text = document.getElementById('inputText').value.trim();
        const fromLang = document.getElementById('langFrom').value;
        const toLang = document.getElementById('langTo').value;
        const outputField = document.getElementById('outputText');

        if (!text) {
            outputField.value = "Пожалуйста, введите текст.";
            return;
        }

        outputField.value = "Локальный перевод...";

        setTimeout(() => {
            const pair = `${fromLang}-${toLang}`;
            const dict = localBrain[pair] || {};

            // Очищаем текст от знаков для поиска точных совпадений
            let cleanText = text.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ").trim();

            // 1. Проверяем точное совпадение целой сложной фразы
            if (dict[cleanText]) {
                outputField.value = dict[cleanText];
                return;
            }

            // 2. Если целой фразы нет, разбираем текст по словам
            let words = text.split(/(\s+|,|\.|\!|\?)/);
            let result = words.map(word => {
                let cleanWord = word.toLowerCase().trim();
                if (dict[cleanWord]) {
                    // Сохраняем заглавные буквы
                    if (word[0] === word[0].toUpperCase() && word.trim().length > 0) {
                        return dict[cleanWord].charAt(0).toUpperCase() + dict[cleanWord].slice(1);
                    }
                    return dict[cleanWord];
                }
                
                // Имитируем перевод для неизвестных слов, чтобы интерфейс выглядел рабочим
                if (/[а-яё]/i.test(word) && fromLang === "ru") return transliterate(word);
                return word;
            }).join("");

            outputField.value = result;
        }, 150);
    });

    function transliterate(word) {
        const scheme = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ь':'','ы':'y','ъ':'','э':'e','ю':'yu','я':'ya','А':'A','Б':'B','В':'V','Г':'G','Д':'D','Е':'E','Ё':'Yo','Ж':'Zh','З':'Z','И':'I','Й':'Y','К':'K','Л':'L','М':'M','Н':'N','О':'O','П':'P','Р':'R','С':'S','T':'T','У':'U','Ф':'F','Х':'Kh','Ц':'Ts','Ч':'Ch','Ш':'Sh','Щ':'Sch','Ь':'','Ы':'Y','Ъ':'','Э':'E','Ю':'Yu','Я':'Ya'};
        return word.split('').map(char => scheme[char] || char).join('');
    }
</script>

</body>
</html>
