<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Custom AI Translator</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: transparent; 
        }
        .translator-container { 
            max-width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .controls { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            justify-content: center; 
        }
        .translator-box { 
            display: flex; 
            gap: 15px; 
            width: 100%; 
        }
        textarea { 
            width: 50%; 
            height: 180px; 
            padding: 15px; 
            border: 1px solid #dadce0; 
            border-radius: 10px; 
            font-size: 16px; 
            outline: none; 
            resize: none;
            box-sizing: border-box; 
            font-family: inherit;
        }
        textarea:focus { 
            border-color: #1a73e8; 
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        textarea[readonly] { 
            background-color: #f8f9fa; 
            color: #3c4043; 
        }
        select { 
            padding: 10px 16px; 
            border: 1px solid #dadce0; 
            border-radius: 8px; 
            font-size: 14px; 
            background: white; 
            cursor: pointer; 
            outline: none; 
        }
        button { 
            padding: 10px 24px; 
            background: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { 
            background: #1557b0; 
        }
        @media (max-width: 600px) { 
            .translator-box { flex-direction: column; } 
            textarea { width: 100%; height: 130px; } 
        }
    </style>
</head>
<body>

<div class="translator-container">
    <div class="controls">
        <select id="langFrom">
            <option value="ru" selected>Русский</option>
            <option value="en">Английский</option>
        </select>
        
        <button id="translateBtn">Перевести ⇄</button>
        
        <select id="langTo">
            <option value="en" selected>Английский</option>
            <option value="ru">Русский</option>
        </select>
    </div>

    <div class="translator-box">
        <textarea id="inputText" placeholder="Введите текст для перевода..."></textarea>
        <textarea id="outputText" placeholder="Здесь появится перевод" readonly></textarea>
    </div>
</div>

<script>
    document.getElementById('translateBtn').addEventListener('click', function() {
        const text = document.getElementById('inputText').value.trim();
        const fromLang = document.getElementById('langFrom').value;
        const toLang = document.getElementById('langTo').value;
        const outputField = document.getElementById('outputText');

        if (!text) {
            outputField.value = "Пожалуйста, введите текст.";
            return;
        }

        outputField.value = "Перевод...";

        // Генерируем уникальное имя для глобальной функции обратного вызова
        const callbackName = 'wixTranslateCallback_' + Math.round(100000 * Math.random());
        
        // Регистрируем временную функцию в глобальной области видимости окна iframe
        window[callbackName] = function(data) {
            try {
                if (data && data[0]) {
                    let translatedText = '';
                    data[0].forEach(function(part) {
                        if (part && part[0]) {
                            translatedText += part[0];
                        }
                    });
                    outputField.value = translatedText;
                } else {
                    outputField.value = "Ошибка: Не удалось распознать структуру ответа.";
                }
            } catch (e) {
                outputField.value = "Ошибка обработки перевода.";
            }
            
            // Удаляем отработавший тег скрипта и функцию для предотвращения утечек памяти
            document.body.removeChild(script);
            delete window[callbackName];
        };

        // Создаем динамический тег скрипта. Метод JSONP гарантированно обходит CORS в Origin: null
        const script = document.createElement('script');
        script.src = `https://googleapis.com{fromLang}&tl=${toLang}&dt=t&q=${encodeURIComponent(text)}&callback=${callbackName}`;
        
        script.onerror = function() {
            outputField.value = "Ошибка соединения с сервером. Повторите попытку.";
            try { document.body.removeChild(script); } catch(e){}
        };
        
        document.body.appendChild(script);
    });
</script>

</body>
</html>


</body>
</html>
