<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Custom AI Translator</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: transparent; 
        }
        .translator-container { 
            max-width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .controls { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            justify-content: center; 
        }
        .translator-box { 
            display: flex; 
            gap: 15px; 
            width: 100%; 
        }
        textarea { 
            width: 50%; 
            height: 180px; 
            padding: 15px; 
            border: 1px solid #dadce0; 
            border-radius: 10px; 
            font-size: 16px; 
            outline: none; 
            resize: none;
            box-sizing: border-box; 
            font-family: inherit;
        }
        textarea:focus { 
            border-color: #1a73e8; 
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        textarea[readonly] { 
            background-color: #f8f9fa; 
            color: #3c4043; 
        }
        select { 
            padding: 10px 16px; 
            border: 1px solid #dadce0; 
            border-radius: 8px; 
            font-size: 14px; 
            background: white; 
            cursor: pointer; 
            outline: none; 
        }
        button { 
            padding: 10px 24px; 
            background: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { 
            background: #1557b0; 
        }
        @media (max-width: 600px) { 
            .translator-box { flex-direction: column; } 
            textarea { width: 100%; height: 130px; } 
        }
    </style>
</head>
<body>

<div class="translator-container">
    <div class="controls">
        <select id="langFrom">
            <option value="ru" selected>Русский</option>
            <option value="en">Английский</option>
        </select>
        
        <button id="translateBtn">Перевести ⇄</button>
        
        <select id="langTo">
            <option value="en" selected>Английский</option>
            <option value="ru">Русский</option>
        </select>
    </div>

    <div class="translator-box">
        <textarea id="inputText" placeholder="Введите сложный текст (например: Здравствуйте! Как у вас жизнь?)..."></textarea>
        <textarea id="outputText" placeholder="Здесь появится готовый перевод" readonly></textarea>
    </div>
</div>

<script>
    document.getElementById('translateBtn').addEventListener('click', function() {
        const text = document.getElementById('inputText').value.trim();
        const fromLang = document.getElementById('langFrom').value;
        const toLang = document.getElementById('langTo').value;
        const outputField = document.getElementById('outputText');

        if (!text) {
            outputField.value = "Пожалуйста, введите текст.";
            return;
        }

        outputField.value = "Перевод...";

        // 1. Создаем абсолютно уникальное глобальное имя для колбэка
        const callbackName = 'mymemory_cb_' + Math.round(100000 * Math.random());
        
        // 2. Регистрируем функцию обработки ответа в глобальном окне
        window[callbackName] = function(response) {
            try {
                if (response && response.responseData && response.responseData.translatedText) {
                    // Декодируем HTML-сущности, если API вернул их (например, &quot; вместо кавычек)
                    const txt = document.createElement('textarea');
                    txt.innerHTML = response.responseData.translatedText;
                    outputField.value = txt.value;
                } else {
                    outputField.value = "Ошибка: Сервер вернул пустой или некорректный ответ.";
                }
            } catch (e) {
                outputField.value = "Ошибка обработки данных.";
            }
            
            // Чистим за собой DOM и память
            if (script && script.parentNode) {
                script.parentNode.removeChild(script);
            }
            delete window[callbackName];
        };

        // 3. Формируем динамический тег скрипта. 
        // MyMemory API идеально принимает параметр &callback= и отдает валидный JSONP, который пробивает Sandbox в Wix.
        const script = document.createElement('script');
        script.src = `https://translated.net{encodeURIComponent(text)}&langpair=${fromLang}|${toLang}&callback=${callbackName}`;
        
        script.onerror = function() {
            outputField.value = "Ошибка соединения. Пожалуйста, попробуйте еще раз.";
            try { document.body.removeChild(script); } catch(e){}
            delete window[callbackName];
        };
        
        // Добавляем скрипт на страницу для выполнения запроса
        document.body.appendChild(script);
    });
</script>

</body>
</html>
