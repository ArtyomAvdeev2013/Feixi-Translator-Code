<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Брендированный Переводчик</title>
    <!-- Подключаем официальную библиотеку ИИ-сервисов Puter, которая разрешена в фреймах -->
    <script src="https://puter.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: transparent; 
        }
        .translator-container { 
            max-width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .controls { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            justify-content: center; 
        }
        .translator-box { 
            display: flex; 
            gap: 15px; 
            width: 100%; 
        }
        textarea { 
            width: 50%; 
            height: 180px; 
            padding: 15px; 
            border: 1px solid #dadce0; 
            border-radius: 10px; 
            font-size: 16px; 
            outline: none; 
            resize: none;
            box-sizing: border-box; 
            font-family: inherit;
        }
        textarea:focus { 
            border-color: #1a73e8; 
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }
        textarea[readonly] { 
            background-color: #f8f9fa; 
            color: #3c4043; 
        }
        select { 
            padding: 10px 16px; 
            border: 1px solid #dadce0; 
            border-radius: 8px; 
            font-size: 14px; 
            background: white; 
            cursor: pointer; 
            outline: none; 
        }
        button { 
            padding: 10px 24px; 
            background: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { 
            background: #1557b0; 
        }
        @media (max-width: 600px) { 
            .translator-box { flex-direction: column; } 
            textarea { width: 100%; height: 130px; } 
        }
    </style>
</head>
<body>

<div class="translator-container">
    <div class="controls">
        <select id="langFrom">
            <option value="Russian" selected>Русский</option>
            <option value="English">Английский</option>
            <option value="German">Немецкий</option>
            <option value="Spanish">Испанский</option>
        </select>
        
        <button id="translateBtn">Перевести ⇄</button>
        
        <select id="langTo">
            <option value="English" selected>Английский</option>
            <option value="Russian">Русский</option>
            <option value="German">Немецкий</option>
            <option value="Spanish">Испанский</option>
        </select>
    </div>

    <div class="translator-box">
        <textarea id="inputText" placeholder="Введите любой сложный текст для перевода..."></textarea>
        <textarea id="outputText" placeholder="Здесь появится автоматический перевод" readonly></textarea>
    </div>
</div>

<script>
    document.getElementById('translateBtn').addEventListener('click', async () => {
        const text = document.getElementById('inputText').value.trim();
        const fromLang = document.getElementById('langFrom').value;
        const toLang = document.getElementById('langTo').value;
        const outputField = document.getElementById('outputText');

        if (!text) {
            outputField.value = "Пожалуйста, введите текст.";
            return;
        }

        outputField.value = "ИИ вычисляет перевод...";

        try {
            // Прямой вызов встроенной бесплатной нейросети Putер ИИ, адаптированной под фреймы
            const response = await puter.ai.chat(
                `Translate the following text from ${fromLang} to ${toLang}. Return ONLY the direct translation without any extra comments, explanations or markdown quotes: "${text}"`
            );

            if (response && response.message && response.message.content) {
                outputField.value = response.message.content.trim();
            } else {
                outputField.value = "Ошибка: ИИ вернул пустой ответ.";
            }
        } catch (err) {
            outputField.value = "Служба перегружена. Попробуйте еще раз через мгновение.";
        }
    });
</script>

</body>
</html>
